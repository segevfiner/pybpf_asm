name: Build Wheels

on:
  push:
    branches:
    - master
    tags:
    - 'v[0-9].*'
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15-intel]

    steps:
      - uses: actions/checkout@v7

      # Used to host cibuildwheel
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Build sdist
        if: matrix.os == 'ubuntu-22.04'
        run: |
          pip install build
          python -m build --sdist

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_SKIP: '*t-* *-musllinux* *linux_i686'
          CIBW_BEFORE_ALL_LINUX: >
            ln -s /etc/ssl/certs/ca-bundle.crt /etc/ssl/certs/ca-certificates.crt &&
            curl -fsSL https://github.com/moparisthebest/static-curl/releases/download/v7.81.0/curl-amd64 -o /usr/local/bin/curl &&
            chmod +x /usr/local/bin/curl &&
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" &&
            brew install flex bison
          CIBW_ENVIRONMENT_LINUX: PATH="/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:$PATH"
          CIBW_BEFORE_ALL_WINDOWS: >
            pwsh -c "Invoke-WebRequest https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip -OutFile win_flex_bison-2.5.25.zip &&
            Expand-Archive win_flex_bison-2.5.25.zip tools"
          CIBW_ENVIRONMENT_WINDOWS: PATH="$(cmd /c cd)\\tools;$PATH"
          CIBW_BEFORE_ALL_MACOS: >
            brew install flex bison
          CIBW_ENVIRONMENT_MACOS: PATH="/usr/local/opt/flex/bin:/usr/local/opt/bison/bin:$PATH"
          CIBW_ARCHS_MACOS: universal2
        with:
          output-dir: dist

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*

  publish:
    name: Publish
    needs: [build_wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/bpf-asm/

    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: wheels-*
        merge-multiple: true
        path: dist

    - name: Publish release distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*
